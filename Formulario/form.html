<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <h1>FORMULARIO DE REGISTRO</h1>
    <P>
        completa la informacion solicitada
    </P>

    <div class="caja">

        <form action="">

            <fieldset>

                <legend>Datos Personales</legend>

                <label for="">Nombre</label><br>
                <input type="text" placeholder="Escibre tu nombre"><br>

                <label for="">Apellido</label><br>
                <input type="text" placeholder="Escibre tu Apellidos"><br>

                <label for="">DNI</label><br>
                <input type="text" placeholder="1234658A"><br>

                <label for="">Fecha nacimiento</label><br>
                <input type="date"><br>

                <label for="">Telefono</label><br>
                <input type="number" placeholder="652043264"><br>

            </fieldset>

            <fieldset>

                <legend>Datos Usuario</legend>

                <label for="">Correo Electronico</label><br>
                <input type="email" placeholder="correo@Dominio" required><br>

                <label for="">Contraseña</label><br>
                <input type="password" required><br>

                <label for="">Confirmar Contraseña</label><br>
                <input type="password" required><br>

            </fieldset>

            <fieldset>

                <legend>Datos de la Web</legend>

                <label for="">Nombre de la Web</label><br>
                <input type="text" placeholder="https://dominio.com"><br>

                <label for="">Color Principal</label><br>
                <input type="color " required><br>

                <label for="">Confirmar Contraseña</label><br>
                <textarea name="" id="" placeholder="Describe tu proyecto Web"></textarea>

            </fieldset>

        </form>

    </div>
</body>

</html>
