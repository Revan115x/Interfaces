<!DOCTYPE html>
<html>
    <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://fonts.googleapis.com/css?family=Mansalva&display=swap" rel="stylesheet">	
        <style>
        body {
            background-color:rgba(194, 13, 96, 0.7);
            font-family: 'Mansalva', cursive;
            font-size: 100%;
        }
        @media only screen and (max-width: 750px) {
            body {
                background-color:lightblue;
                font-size:0.6em;
            }
        }
        </style>
    </head>
    <body>
        <h1>Cambian las propiedades de la página cuando la resolución es menor de 750px. El color de fondo cambia de dorado a aguamarina y el tamaño de la fuente se reduce a la mitad. </h1>
    </body>
</html>
