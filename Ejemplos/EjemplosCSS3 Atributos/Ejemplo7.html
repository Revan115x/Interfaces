<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Hacer un resplandor exterior con CSS3</title>
	<style>
	body{
		font-family: Trebuchet MS, verdana, sans-serif;
		background-color: #000;
		color: #fff;
	}
	.resplandorblanco{	
		box-shadow: 0px 0px 30px #ffffff;		
		padding: 10px;
		border: 1px solid #fff;
		width: 160px;
		margin: 40px;
	}	
	.resplandorverde{	
		box-shadow: 0px 0px 30px #A3FF0F;		
		padding: 10px;
		border: 1px solid #66ff00;
		width: 160px;
		margin: 40px;
	}
	</style>
</head>
<body>
	<div class="resplandorblanco">
		Esta capa tiene un resplandor exterior!!
	</div>	
	<div class="resplandorverde">
		Esta capa tiene un resplandor exterior, pero ahora he utilizado un resplandor de color verde!!
	</div>
</body>
</html>
