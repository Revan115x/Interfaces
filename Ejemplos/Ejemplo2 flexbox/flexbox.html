<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo flexbox</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        body {
            font-family: "Nunito", sans-serif;
        }
        .flex-container1 {
            margin-top: 20px;
            display: flex;       
            flex-direction:row;
            flex-wrap: wrap;
            justify-content:space-around;
            align-items: center;
        }
         .flex-container1 > div {
            background-color: #f1f1f1;
            margin: 10px;
            font-size: 30px;
            text-align: center; 
            border-radius: 5px;    
            padding: 10px;  
        }
        #titulo{
            font-size: 4em;
        }
        #menu{
            width: 40%; 
            background-color: white;
            display:flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }
        .flex-container2 {
            margin-top: 40px;
            display: flex;        
            flex-direction:row;
            flex-wrap: wrap;
            justify-content:center;
            align-items: center;
        }    
        .flex-container2 > img {
            background-color: #f1f1f1;
            margin: 10px;
            font-size: 30px;
            text-align: center;          
        }
        img{
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0px 0px 5px black; 
        }
        .tam1 {
            width: 800px;
        }
        a{
            text-decoration: none;
            color:black;
        }
        a:hover{
            text-decoration: underline;
        }
    </style>
</head>
<body>
     <div class="flex-container1">
        <div id="titulo">MONTEJO</div>
        <div id="menu"><a href="#">Rutas</a><a href="#">Reservas</a><a href="#">Contacto</a></div>
    </div>
    <div class="flex-container2">
        <img src="img1.jpg" class="tam1">
        <img src="img2.jpg">
        <img src="img3.jpg">  
    </div>
</body>
</html>
