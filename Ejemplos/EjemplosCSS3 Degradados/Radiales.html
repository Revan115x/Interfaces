<!DOCTYPE html>
<html lang="es">
<head>
    <title>Probando degradado CSS 3</title>
	<style type="text/css">
		div{
			border: 1px solid #000;
			padding:10px;
			margin: 20px;
			height: 130px;
			width: 230px;
			float: left;
		}
		.degradado1{
			background: radial-gradient(#0f0, #06f);
		}
		.degradado3{
			background: radial-gradient(200px 30px, #f0f, #000);
		}
		.degradado5{
			background: radial-gradient(circle, #66f, #f80, #ffc);
		}
		.degradado13{
			background: repeating-radial-gradient(circle, #fff, #666 25%);
		}
	</style>
</head>
<body>
	<div class="degradado1"></div>
	<div class="degradado3"></div>
	<div class="degradado5"></div>
	<div class="degradado13"></div>
</body>
</html>
