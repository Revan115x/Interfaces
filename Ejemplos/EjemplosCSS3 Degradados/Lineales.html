<!DOCTYPE html>
<html lang="es">
<head>
    <title>Degradados lineales CSS 3</title>
	<style type="text/css">
	div{
		border: 1px solid #000;
		padding:10px;
		margin: 20px;
		height: 130px;
		width: 230px;
		float: left;
	}
	.degradado1{
		background: linear-gradient(orange, pink);
	}
	.degradado3{
		background: linear-gradient(180deg, #f0f, #f66);
	}
	.degradado4{
		background: linear-gradient(#00f 50%, #000);
	}
	.degradado5{
		background: linear-gradient(45deg, #66f, #f80, #ffc);
	}
	.degradado6{
		background: linear-gradient(45deg, #66f 10%, #f80 30%, #ffc 60%);
	}
	.degradado7{
		background: linear-gradient(45deg, #66f 160px, #f80 180px, #ffc);
	}
	.degradado9{
		background: repeating-linear-gradient(#fff, #666 25%);
	}
	.degradado11{
		background: repeating-linear-gradient(45deg, red, blue, red 50px);
	}
	</style>
</head>
<body>
	<div class="degradado1"></div>
	<div class="degradado3"></div>
	<div class="degradado4"></div>
	<div class="degradado5"></div>
	<div class="degradado6"></div>
	<div class="degradado7"></div>
	<div class="degradado9"></div>
	<div class="degradado11"></div>
</body>
</html>
